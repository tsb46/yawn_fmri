[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "scan-physio"
version = "0.1.0"
description = "Analysis of the relationship between the SCAN network and global BOLD fluctuations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fbpca==1.0",
    "mne==1.7.1",
    "neurokit2==0.2.11",
    "nilearn==0.10.4",
    "nipype==1.8.6",
    "pandas==2.0.1",
    "patsy==0.5.3",
    "PyWavelets==1.8.0",
    "tedana==24.0.1",
]

[project.optional-dependencies]
viz = [
    "dash>=2.17",
    "imageio-ffmpeg",
    "plotly>=5.24",
]
templates = [
    "neuromaps>=0.0.6",
    "templateflow",
]

[tool.hatch.build.targets.wheel]
packages = ["scan"]
